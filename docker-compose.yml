version: '3.8'

services:
  app:
    image: laravel-11-app
    container_name: laravel-11_app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:80"
    volumes:
      - .:/var/www
    depends_on:
      - db
    networks:
      - laravel-net

  db:
    image: mysql:8.0
    container_name: laravel-11_db_1
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: laravel_db
      MYSQL_USER: laravel_user
      MYSQL_PASSWORD: userpassword
    ports:
      - "3300:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel-net
    command: --skip-grant-tables --skip-networking # Ajuste se necessário para depuração

  redis:
    image: redis:alpine
    container_name: laravel-11_redis_1
    ports:
      - "6379:6379"
    networks:
      - laravel-net

   # nginx
  nginx:
        image: nginx:alpine
        restart: unless-stopped
        ports:
            - "8000:80"
        volumes:
            - ./:/var/www
            - ./docker/nginx/:/etc/nginx/conf.d/
        networks:
            - laravel-net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: laravel-11_phpmyadmin_1
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "8080:80"
    networks:
      - laravel-net

networks:
  laravel-net:
    driver: bridge

volumes:
  db_data:
    driver: local
